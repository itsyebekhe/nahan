# Wrangler Configuration for Nahan (نهان) Edge Gateway Node
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "nahan"
main = "src/index.js"
compatibility_date = "2024-03-01"

# Automatically run the local dev server on a predictable port
[dev]
port = 8787

# D1 Database Configuration for state & config persistence
# To provision a new D1 database, run: npx wrangler d1 create nahan-db
# Or use the interactive installer: npm run install:wrangler
[[d1_databases]]
binding = "IOT_DB"
database_name = "nahan-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# Environment Variables (Optional presets)
[vars]
API_ROUTE = "nahan-gate"
DECOY_DOMAIN = "ubuntu.com"
